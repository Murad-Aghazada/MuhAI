# ============================================================
# Muhai — local development stack
#
# Cloud Firestore is the system of record (see firestore.rules).
# The API is a stateless compute layer: the 2026 tax engine, the Muhai
# Score, Prophet forecasting, payroll, Tesseract OCR and the assistant.
# It reads no database, so the default stack is just the API:
#
#     docker compose up -d            → backend on :8000
#
# Postgres, Redis and the Celery worker remain for the older DB-backed
# routes (/api/invoices, /api/transactions, …) and are opt-in:
#
#     docker compose --profile legacy up -d
#
# The project name is pinned (see N2 in CLAUDE.md) so the volume key
# `postgres_data` still resolves to the existing `muhai_postgres_data`.
# ============================================================

name: muhai

services:
  backend:
    image: muhai-backend:latest
    build: ./backend
    container_name: muhai_backend
    # Migrations are best-effort: without the legacy profile there is no
    # Postgres to migrate, and the compute API must still come up. `;`
    # rather than `&&` so a failed upgrade never blocks uvicorn.
    command: >
      sh -c "alembic upgrade head || echo '[muhai] no database reachable — legacy DB routes disabled, /api/compute unaffected';
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ./backend/.env
    environment:
      # Docker network hostnames, used when the legacy profile is running.
      DATABASE_URL: postgresql+asyncpg://muhai:muhai_secret@postgres/muhai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: muhai_postgres
    profiles: ["legacy"]
    environment:
      POSTGRES_USER: muhai
      POSTGRES_PASSWORD: muhai_secret
      POSTGRES_DB: muhai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muhai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: muhai_redis
    profiles: ["legacy"]
    command: redis-server
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery_worker:
    image: muhai-celery_worker:latest
    build: ./backend
    container_name: muhai_celery
    profiles: ["legacy"]
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://muhai:muhai_secret@postgres/muhai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
