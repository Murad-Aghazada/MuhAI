# ============================================================
# Muhai — local development stack
#
# Reconstructed from the surviving container metadata after the
# original D:\MuhAI working tree was lost. Service names, container
# names, env, ports, healthcheck and the volume name all match the
# original project so the existing `muhai_postgres_data` volume is
# reused rather than recreated.
# ============================================================

name: muhai

services:
  postgres:
    image: postgres:15
    container_name: muhai_postgres
    environment:
      POSTGRES_USER: muhai
      POSTGRES_PASSWORD: muhai_secret
      POSTGRES_DB: muhai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muhai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: muhai_redis
    command: redis-server
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    image: muhai-backend:latest
    build: ./backend
    container_name: muhai_backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ./backend/.env
    environment:
      # Override the .env host values with the docker network names.
      DATABASE_URL: postgresql+asyncpg://muhai:muhai_secret@postgres/muhai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery_worker:
    image: muhai-celery_worker:latest
    build: ./backend
    container_name: muhai_celery
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://muhai:muhai_secret@postgres/muhai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
